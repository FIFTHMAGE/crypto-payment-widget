version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crypto_payment_db
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
      POSTGRES_DB: crypto_payment_widget
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - payment_network

  redis:
    image: redis:7-alpine
    container_name: crypto_payment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - payment_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crypto_payment_backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://payment_user:payment_password@postgres:5432/crypto_payment_widget
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - payment_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crypto_payment_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - payment_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  payment_network:
    driver: bridge
