apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-widget
spec:
  replicas: 3
  selector:
    matchLabels: { app: payment-widget }
  template:
    metadata:
      labels: { app: payment-widget }
    spec:
      containers:
      - name: frontend
        image: payment-widget:latest
        ports: [{ containerPort: 80 }]

